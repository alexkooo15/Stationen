<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--pitch:#0A241B;--grass:#12392A;--line:#21604A;--chalk:#F3F1E7;--mute:#9DB8AA;--yel:#F2D335;--ok:#4CD08A;--bad:#F0647A;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--pitch)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--chalk);font-family:'Barlow',system-ui,sans-serif;background:repeating-linear-gradient(90deg,#0A241B 0 56px,#0C2A1F 56px 112px)}
.wrap{max-width:480px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
h1{font:700 34px/1 'Barlow Condensed',sans-serif;margin:0}
.sub{color:var(--mute);font-size:14px;margin:4px 0 0}
.score{text-align:right;font:700 30px/1 'Barlow Condensed',sans-serif;color:var(--yel)}
.score small{display:block;font:500 13px 'Barlow',sans-serif;color:var(--mute)}
.card{background:var(--grass);border:1px solid var(--line);border-radius:18px;padding:22px 18px}
.top{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);margin-bottom:10px}
.top b{color:var(--yel)}
.bar{height:6px;background:#0A241B;border-radius:4px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;width:0;background:var(--yel)}
.chips{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:256px;margin-bottom:6px;overflow:hidden}
.chip{display:flex;align-items:center;justify-content:center;gap:7px;width:min(100%,340px);flex:none;background:#0A241B;border:1px solid var(--line);border-radius:12px;padding:5px 8px;min-height:34px;font:600 18px/1.1 'Barlow Condensed',sans-serif;animation:in .45s ease-out}
.chip .cn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip .yr{font:500 13px/1.1 'Barlow',sans-serif;color:var(--yel);white-space:nowrap;padding-left:7px;border-left:1px solid var(--line)}
.chip .crest{width:22px;height:25px;font-size:10px;padding-bottom:4px}
.chip .dot{width:14px;height:14px;border-radius:50%;flex:none}
.chip .n{display:none}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.in{margin-top:14px;position:relative}
#chk{display:block;width:100%;margin-bottom:10px}
input{width:100%;font:500 17px 'Barlow',sans-serif;color:var(--chalk);background:#0A241B;border:2px solid var(--line);border-radius:14px;padding:14px}
input:focus-visible,button:focus-visible{outline:2px solid var(--yel);outline-offset:2px}
.sug{display:flex;flex-direction:column;margin-top:6px;border-radius:12px;overflow:hidden}
.sug button{text-align:left;background:#143F2E;border:0;border-top:1px solid var(--line);color:var(--chalk);font:500 16px 'Barlow',sans-serif;padding:12px 14px;cursor:pointer}
.msg{min-height:22px;margin:10px 0 0;font-size:15px}
.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}.msg.hint{color:var(--yel)}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.row{display:flex;gap:8px;margin-top:22px}
.btn{flex:1;font:600 16px 'Barlow',sans-serif;border-radius:12px;padding:13px;border:1px solid var(--line);background:transparent;color:var(--chalk);cursor:pointer}
.btn.y{background:var(--yel);color:#2A2200;border-color:var(--yel)}
.hide{display:none}
.modes{display:flex;gap:6px;margin-bottom:6px}.modes button{flex:1;min-width:0;font:600 13px 'Barlow',sans-serif;color:var(--mute);background:transparent;border:1px solid var(--line);border-radius:10px;padding:9px 0;cursor:pointer}.modes button.on{background:var(--yel);color:#2A2200;border-color:var(--yel)}#mdesc{margin:0 0 14px;color:var(--mute);font-size:13px;line-height:1.35}.letter{margin-top:12px;font:700 22px 'Barlow Condensed',sans-serif;color:var(--yel);white-space:pre-wrap;letter-spacing:1px}
.crest{width:30px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;font:700 12px 'Barlow Condensed',sans-serif;color:#fff;background:hsl(var(--h) 60% 38%);clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);padding-bottom:5px}
.plh{margin:22px 0 8px;font:700 20px 'Barlow Condensed',sans-serif}
.qh{font:700 27px/1.25 'Barlow Condensed',sans-serif;margin:4px 0 24px;padding:18px 14px;text-align:center;background:#0A241B;border:2px solid var(--line);border-radius:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;counter-reset:o}
.opts button{text-align:left;background:#0A241B;border:1px solid var(--line);border-radius:12px;padding:13px 14px;color:var(--chalk);font:500 16px 'Barlow',sans-serif;cursor:pointer}
.opts button.ok{background:#14513A;border-color:var(--ok)}
.opts button.bad{background:#4C1B2A;border-color:var(--bad)}
.opts button{min-height:60px;padding:14px 12px;font-size:15px;line-height:1.2;border-radius:14px}
.opts button::before{counter-increment:o;content:counter(o,upper-alpha) ":";color:var(--yel);font-weight:700;margin-right:8px}
.opts button:disabled{color:var(--chalk)}
#menu,#lvl,#res,#stat{position:fixed;inset:0;z-index:50;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;background:radial-gradient(90% 50% at 50% 30%,#14503A 0,transparent 70%),repeating-linear-gradient(90deg,#0A241B 0 56px,#0C2A1F 56px 112px)}
#menu h1{font-size:68px;letter-spacing:1px}
#menu .msub{margin:6px 0 0;font:600 15px 'Barlow',sans-serif;letter-spacing:2.5px;text-transform:uppercase;color:var(--yel)}
#menu .tag{color:var(--mute);margin:10px 0 28px;max-width:300px;line-height:1.4}
.demo{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:140px;width:100%;margin-bottom:28px}
.demo .chip{opacity:0;animation:in .5s ease-out forwards}
.demo .chip:nth-child(2){animation-delay:.9s}.demo .chip:nth-child(3){animation-delay:1.8s}
#menu .btn{display:block;width:min(100%,320px);font-size:18px;padding:16px;margin-bottom:12px;text-align:center}
.menubtn{position:sticky;top:0;z-index:5;display:block;width:100%;text-align:left;background:var(--pitch);border:0;border-bottom:1px solid var(--line);color:var(--chalk);font:600 16px 'Barlow',sans-serif;padding:12px 0;margin-bottom:12px;cursor:pointer}
#modes,#mdesc{display:none}
#lvl h2{font-size:40px;margin:0 0 6px}
#lvl .lv{display:block;width:min(100%,360px);text-align:left;margin-bottom:10px;padding:14px 16px;flex:none}
#lvl .lv b{display:block;font:700 22px 'Barlow Condensed',sans-serif}
#lvl .lv small{display:block;color:var(--mute);font:400 13px/1.3 'Barlow',sans-serif;margin-top:2px}
#lvl .lv.on{border-color:var(--yel)}
#lvl>.btn:last-child{width:min(100%,360px);flex:none}
.cfg{display:flex;gap:10px;margin:10px 0}
.cfg label{flex:1;font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.cfg select{font:500 16px 'Barlow',sans-serif;color:var(--chalk);background:#0A241B;border:2px solid var(--line);border-radius:10px;padding:9px;width:100%}
#lvl .cats{display:flex;gap:8px;width:min(100%,360px);margin:0 0 16px}
#lvl .cats .btn{flex:1;width:auto;margin:0;padding:11px 2px;font-size:15px}
#res h2,#stat h2{font-size:44px;margin:0 0 6px}
#stat .srow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:min(100%,360px);padding:11px 14px;border-radius:12px;background:#0A241B;border:1px solid var(--line);margin-bottom:8px;text-align:left}
#stat .srow b{font:700 20px 'Barlow Condensed',sans-serif}#stat .srow span{color:var(--mute);font-size:14px;text-align:right}
#stat .btn{width:min(100%,360px);flex:none;margin-top:8px}
#lvl .lgs{display:flex;gap:8px;width:min(100%,360px);margin:-6px 0 16px}#lvl .lgs .btn{flex:1;margin:0;padding:9px 2px;font-size:14px}
.ph{display:none;margin:0 0 6px;text-align:center}.ph .fr{position:relative;height:236px;border-radius:14px;overflow:hidden;background:#0A241B;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:15px}
.ph img{width:100%;height:100%;object-fit:cover;display:block;animation:phin .4s ease-out;transition:transform 1.1s cubic-bezier(.3,.7,.3,1)}
@keyframes phin{from{opacity:0}to{opacity:1}}
.ph .cr{font-size:11px;line-height:1.35;color:var(--mute);margin-top:6px;min-height:15px;word-break:break-word}.ph .cr a{color:var(--mute)}
#res .rv{margin-bottom:10px}#res .wt{color:var(--mute);margin:0 0 12px;font-size:15px}
#res #rl{width:min(100%,360px);margin:18px 0}
#res .btn{width:min(100%,360px);flex:none}
#res .mpr{font-size:17px}
#cd{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(10,36,27,.95);font:700 150px 'Barlow Condensed',sans-serif;color:var(--yel)}
#cd.pop{animation:pop .8s ease-out}
@keyframes pop{from{transform:scale(1.6);opacity:.2}to{transform:scale(1);opacity:1}}
.lobby .card,.lobby #modes,.lobby #mdesc{display:none}
.solo .mp{display:none}
.mp{margin:-6px 0 16px}.mp>.btn{width:100%}
.mpp{margin-top:10px;background:var(--grass);border:1px solid var(--line);border-radius:14px;padding:14px}
.mpp input,.mpp textarea{width:100%;font:500 16px 'Barlow',sans-serif;color:var(--chalk);background:#0A241B;border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.mprow{display:flex;gap:8px;margin-bottom:10px}.mprow input{margin-bottom:0;flex:1;min-width:0;text-transform:uppercase}
.mph{font:700 22px 'Barlow Condensed',sans-serif;margin-bottom:10px}
.mpr{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:10px;background:#0A241B;margin-bottom:6px;font-size:15px;border:1px solid transparent}
.mpr.me{border-color:var(--yel)}.mpr.new{animation:joinin .9s ease-out}@keyframes joinin{0%{opacity:0;transform:translateY(10px);box-shadow:0 0 0 0 rgba(76,208,138,.0)}40%{opacity:1;transform:none;box-shadow:0 0 18px rgba(76,208,138,.7);border-color:var(--ok)}100%{box-shadow:none}}
.mpcnt{font:600 15px 'Barlow',sans-serif;color:var(--mute);margin:2px 0 8px;text-align:left}.mpwait{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;color:var(--mute);margin-bottom:6px;font-size:15px}.mpwait i{width:8px;height:8px;border-radius:50%;background:var(--yel);animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}.mpr .rd{color:var(--ok)}.mpr b{color:var(--yel);font-weight:600;text-align:right}
.pl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pl button{display:flex;align-items:center;gap:10px;text-align:left;background:var(--grass);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--chalk);font:500 14px 'Barlow',sans-serif;cursor:pointer}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font:700 13px 'Barlow Condensed',sans-serif;background:hsl(var(--h) 35% 30%);color:#fff}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .12s ease,background-color .18s,border-color .18s,box-shadow .22s,filter .18s}
button:active:not(:disabled){transform:scale(.96);filter:brightness(1.3);border-color:var(--yel);box-shadow:0 0 0 3px rgba(242,211,53,.35),0 0 20px rgba(242,211,53,.5)}
.btn.y:active:not(:disabled){filter:brightness(1.12);box-shadow:0 0 0 3px rgba(242,211,53,.45),0 0 26px rgba(242,211,53,.8)}
@media (hover:hover){button:hover:not(:disabled){filter:brightness(1.12)}}
.opts button.ok{box-shadow:0 0 18px rgba(76,208,138,.55)}
.opts button.bad{box-shadow:0 0 14px rgba(240,100,122,.45)}
.modes button.on{box-shadow:0 0 14px rgba(242,211,53,.4)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>

 <p class="msg" id="msg"></p>
 <div class="row"><button class="btn" id="give">Aufgeben</button><button class="btn y hide" id="next">Nächster Spieler</button></div>

 me.onDisconnect().remove();await me.set({t:Date.now()});

 const snap=await ref.once('value');
 const build=v=>Object.entries(v||{}).map(([k,x])=>({kind:'viewer',isMe:k===me.key,presence:x}));
 list=build(snap.val());
 ref.on('value',sn=>{list=build(sn.val());cbs.forEach(f=>{try{f({peers:list})}catch(e){}})});
 return{peers:()=>list,onPeers:f=>{cbs.push(f)},presence:o=>me.update(o),leave:()=>{cbs=[];ref.off();me.remove()}};
}

 const row=(a,b)=>{const d=document.createElement('div');d.className='srow';const x=document.createElement('b');x.textContent=a;const y=document.createElement('span');y.textContent=b;d.append(x,y);ST.appendChild(d)};
 Object.entries(MODES).forEach(([k,v])=>{const t=(S.st||{})[k];row(v.name,t&&t.p?t.p+' Runden · '+Math.round(100*t.w/t.p)+' % richtig · Beste Serie '+t.b:'noch nicht gespielt')});
 row('Tägliche Challenge',dStreak()?'🔥 '+dStreak()+(dStreak()>1?' Tage':' Tag')+' in Folge · Rekord '+(S.dbest|0):'Serie: 0 · Rekord '+(S.dbest|0));
 row('Gesamtpunkte',String(S.score|0));
 const bk=document.createElement('button');bk.type='button';bk.className='btn y';bk.textContent='‹ Zurück';bk.onclick=()=>{ST.style.display='none';showMenu()};ST.appendChild(bk);
 ST.style.display='flex';ST.scrollTop=0;
}
const RES=document.createElement('div');RES.id='res';RES.style.display='none';document.body.appendChild(RES);
const CD=document.createElement('div');CD.id='cd';document.body.appendChild(CD);
function countdown(cb){
 let n=3;CD.style.display='flex';
 const show=t=>{sfx(t==='Los!'?'go':'cd');CD.textContent=t;CD.classList.remove('pop');void CD.offsetWidth;CD.classList.add('pop')};
 show(n);
 const t=setInterval(()=>{n--;if(n>0)show(n);else if(n===0)show('Los!');else{clearInterval(t);CD.style.display='none';cb()}},800);
}
function updNext(){let t='Nächster Spieler';const k=kind(ri);if(RM&&RM.started&&ri>=ROUNDS)t='Ergebnis anzeigen';else if(k==='trivia')t='Nächste Frage';else if(k==='photo')t='Nächstes Foto';else{const p=P[order[ri%order.length]];if(p&&p.t)t='Nächster Trainer'}$('#next').textContent=t}
function showResult(){
 sfx('win');if(RM){RM.done=1;pushPresence()}
 RES.style.display='flex';renderResult();
}
function renderResult(){
 if(RES.style.display==='none'||!RM)return;
 const med=['🥇','🥈','🥉'];
 RES.innerHTML='<h2>Ergebnis</h2><p class="tag">'+ROUNDS+' Runden gespielt. Wer noch spielt, wird live aktualisiert.</p><div id="rl"></div>';
 const L=RES.querySelector('#rl');
 [...RM.peers].filter(x=>x.kind==='viewer'&&x.presence&&x.presence.name!==undefined).sort((a,b)=>(b.presence.score|0)-(a.presence.score|0)).forEach((x,i,arr)=>{
  i=arr.findIndex(y=>(y.presence.score|0)===(x.presence.score|0));
  const d=document.createElement('div');d.className='mpr'+(x.isMe?' me':'');
  const n=document.createElement('span');n.textContent=(med[i]||(i+1)+'.')+' '+String(x.presence.name).slice(0,16)+(x.isMe?' (du)':'');
  const b=document.createElement('b');b.textContent=(x.presence.score|0)+' Pkt'+(x.presence.done?'':' · spielt noch');
  d.append(n,b);L.appendChild(d);
 });
 const ps=RM.peers.filter(x=>x.kind==='viewer'&&x.presence&&x.presence.name!==undefined);
 const lead=RM.host||!ps.some(x=>!x.isMe&&x.presence.host);
 if(lead){const rv=document.createElement('button');rv.type='button';rv.className='btn y rv';rv.textContent='Revanche';rv.onclick=()=>{RES.style.display='none';goNow()};RES.appendChild(rv)}
 else{const hn=ps.find(x=>!x.isMe&&x.presence.host);const w=document.createElement('p');w.className='wt';w.textContent='Warte auf die Revanche von '+(hn?String(hn.presence.name).slice(0,16):'dem Raumersteller')+' …';RES.appendChild(w)}
 const lv=document.createElement('button');lv.type='button';lv.className='btn';lv.textContent='Raum verlassen';
 lv.onclick=()=>{RES.style.display='none';leaveRoom()};RES.appendChild(lv);
}
$('#mStat').onclick=showStats;
$('#mSnd').onclick=()=>{S.snd=S.snd===0?1:0;save();$('#mSnd').textContent='Ton und Vibration: '+(S.snd===0?'aus':'an')};
/* Tägliche Challenge */
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dailyIdx(){const d=new Date();const pl=P.map((_,i)=>i).filter(i=>!P[i].t&&P[i].f===1);return pl[Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)%pl.length]}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dStreak(){const y=new Date();y.setDate(y.getDate()-1);return (S.dlast===today()||S.dlast===ymd(y))?(S.dser|0):0}
function dailyDone(win){
 if(S.dlast!==today()){const y=new Date();y.setDate(y.getDate()-1);S.dser=S.dlast===ymd(y)?(S.dser|0)+1:1;S.dlast=today();S.dbest=Math.max(S.dbest|0,S.dser)}
 const sq=win?'⬜'.repeat(shown-1)+'🟩':'🟥'.repeat(shown);
 S.daily={d:today(),win,txt:'Stationen '+today()+'\n'+sq+'\n'+URL_()};save();
 $('#next').textContent='Ergebnis teilen';$('#next').onclick=shareDaily;
}
async function shareDaily(){
 const t=S.daily&&S.daily.txt;if(!t)return;
 const el=MENU.style.display==='none'?$('#msg'):$('#mInfo');
 try{if(navigator.share){await navigator.share({text:t});return}}catch(e){}
 try{await navigator.clipboard.writeText(t);el.textContent='Ergebnis kopiert. Füge es in deinen Chat ein.';return}catch(e){}
 el.textContent=t;
}
$('#mDaily').onclick=()=>{quitRoom();
 if(S.daily&&S.daily.d===today()){$('#mInfo').textContent='Heute erledigt. Die nächste Challenge gibt es morgen.';shareDaily();return}
 hideMenu();DAILY=true;order=[dailyIdx()];ri=0;WRAP.classList.remove('lobby');WRAP.classList.add('solo');start();
};
const LVL=document.createElement('div');LVL.id='lvl';LVL.style.display='none';document.body.appendChild(LVL);
let GO='solo';
function showLevels(go){
 GO=go;MENU.style.display='none';
 if(go==='friends'&&RM&&RM.started){if(RM.lvl)S.mode=RM.lvl;if(RM.cat)S.cat=RM.cat;if(RM.lg)S.lg=RM.lg;launch();return}
 LVL.innerHTML='<h2>Schwierigkeit wählen</h2><p class="tag">'+(go==='friends'?'Stufe und Kategorie des Spielstarters gelten für alle im Raum.':'Je höher die Stufe, desto mehr Punkte.')+'</p>';
 const cats=document.createElement('div');cats.className='cats';
 [['spieler','Spieler'],['trainer','Trainer'],['mix','Gemischt'],['fotos','Fotos']].forEach(([k,n])=>{
  const b=document.createElement('button');b.type='button';b.textContent=n;b.className='btn'+((S.cat||'spieler')===k?' y':'');
  b.onclick=()=>{S.cat=k;save();cats.querySelectorAll('button').forEach(x=>x.classList.toggle('y',x===b))};
  cats.appendChild(b);
 });
 LVL.appendChild(cats);
 const lgs=document.createElement('div');lgs.className='lgs';
 Object.entries(LIGEN).forEach(([k,n])=>{const b=document.createElement('button');b.type='button';b.textContent=n;b.className='btn'+((S.lg||'alle')===k?' y':'');b.onclick=()=>{S.lg=k;save();lgs.querySelectorAll('button').forEach(x=>x.classList.toggle('y',x===b))};lgs.appendChild(b)});
 LVL.appendChild(lgs);
 Object.entries(MODES).forEach(([k,v])=>{
  const b=document.createElement('button');b.type='button';b.className='btn lv'+((S.mode||'leicht')===k?' on':'');
  b.innerHTML='<b></b><small></small>';b.firstChild.textContent=v.name+' · '+v.x+'× Punkte';b.lastChild.textContent=v.d;
  b.onclick=()=>{S.mode=k;save();LVL.style.display='none';launch()};
  LVL.appendChild(b);
 });
 const bk=document.createElement('button');bk.type='button';bk.className='btn';bk.textContent='‹ Zurück';
 bk.onclick=()=>{LVL.style.display='none';MENU.style.display='flex'};LVL.appendChild(bk);
 LVL.style.display='flex';LVL.scrollTop=0;
}
function launch(){
 setMode();hideMenu();PHO=shuf(phPool());if(S.cat==='fotos'||S.cat==='mix')PHO.slice(0,2).forEach(getPhoto);
 if(GO==='solo'){order=newOrder();ri=0;WRAP.classList.remove('lobby');WRAP.classList.add('solo');start()}
 else{WRAP.classList.remove('solo');if(RM&&RM.started){WRAP.classList.remove('lobby');start()}else{WRAP.classList.add('lobby');clearTimeout(timer);cancelAnimationFrame(tick);$('#mpp').classList.remove('hide');renderMP()}}
}
$('#mSolo').onclick=()=>{quitRoom();showLevels('solo')};
$('#mFriends').onclick=()=>showLevels('friends');
const MB=$('#modes');
Object.entries(MODES).forEach(([k,v])=>{const b=document.createElement('button');b.textContent=v.name;b.dataset.k=k;b.onclick=()=>{S.mode=k;save();setMode()};MB.appendChild(b)});
function setMode(){MB.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===(S.mode||'leicht')));$('#mdesc').textContent=M().d;$('#sug').innerHTML='';renderPL();if(cur&&!done)start()}
setMode();
function nextRound(){if(RM&&RM.started&&ri>=ROUNDS)return showResult();start()}
$('#next').onclick=nextRound;
showMenu();
/* Offline-Unterstützung auf GitHub: Erst Internet, dann Zwischenspeicher */
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!inClaude())navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
/* Einladungslink ?raum=CODE: direkt zum Beitreten öffnen */
var INV='';try{INV=(new URLSearchParams(location.search).get('raum')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4)}catch(e){}
if(INV.length===4){S.cat=S.cat||'spieler';GO='friends';MENU.style.display='none';WRAP.classList.remove('solo');WRAP.classList.add('lobby');$('#mpp').classList.remove('hide');renderMP();mpMsg('Gib deinen Namen ein und tippe auf Beitreten.')}
</script>
